    archive_url: https://github.com/YosysHQ/yosys/releases/download/v0.69/yosys.tar.gz
    archive_file: yosys.tar.gz
    notes: >
      The release archive vendors the required submodules and is flat; the
      Containerfile intentionally does not strip a leading directory.

  - name: yosys-build-clang
    arg: YOSYS_CLANG_VERSION
    version: "16"
    source: https://apt.llvm.org/jammy/
    upstream: manual
    arch: "build-time only; apt.llvm.org publishes linux/amd64 and linux/arm64 packages"
    notes: >
      Yosys 0.67 and newer require at least Clang 16 or GCC 13. The versioned
      LLVM Jammy channel is used only in builder-eda; it does not alter the
      compiler installed in the runtime image.

  - name: yosys-build-python
    arg: YOSYS_PYTHON_APT_VERSION
    version: "3.11.0~rc1-1~22.04.1"
    source: ubuntu-22.04 archive
    upstream: ubuntu:jammy/python3.11
    arch: "build-time only; linux/amd64 and linux/arm64"
    notes: >
      Yosys 0.69 documents Python 3.11 or newer as a build prerequisite.
      Python 3.11 is installed only in builder-eda; the course runtime remains
      on Python 3.10 for its existing OpenROAD and package compatibility.

