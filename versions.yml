# Version manifest for the containerized course toolchain.
#
# This is the single source of truth. No version string may be hard-coded in
# the Containerfile, in a build script, or in the documentation: every pin is
# written here once and injected as a build argument by scripts/versions.py,
# which also refuses to let this file and the Containerfile drift apart.
#
# Grammar (deliberately narrow, so that reading it needs nothing beyond the
# Python standard library): top-level scalars, then a single `tools:` list of
# flat mappings. Values are scalars or `>` folded blocks.
#
# Fields:
#   name     human-readable tool name.
#   arg      Containerfile ARG that receives this pin. Every ARG the
#            Containerfile declares must appear here, and vice versa.
#   version  tag, commit, package version, or release asset identifier.
#   source   where it comes from.
#   arch     architecture support as actually discovered by this spike.
#   notes    reproducibility caveats and technical debt.

manifest_version: 1
spike: kitchen-sink-toolchain-container
recorded: 2026-08-16

tools:
  - name: base-image
    arg: BASE_IMAGE
    version: "ubuntu:22.04@sha256:3b06811b2afd352be909dd088a004166d665dc76d38b13eada33522a9d915c6f"
    source: docker.io/library/ubuntu
    arch: "multi-arch index: linux/amd64 and linux/arm64 manifests both present"
    notes: >
      Ubuntu 22.04 rather than 24.04 is forced by the OpenROAD binary channel,
      whose .deb requires libpython3.10 and the pre-t64 libqt5* package names.
      Ubuntu 24.04 ships Python 3.12 and renamed every Qt5 package to *t64, so
      that .deb cannot be installed there. Pinned by index digest so the same
      line resolves for both architectures.

  # --- simulation and synthesis ---------------------------------------------

  - name: icarus-verilog
    arg: IVERILOG_REF
    version: "v12_0"
    source: https://github.com/steveicarus/iverilog (archive refs/tags/v12_0.tar.gz)
    arch: "unknown for linux/arm64: upstream CI has no aarch64 job"
    notes: >
      Source build pinned to the tag. Ubuntu 22.04 packages 11.0, but the
      native Lab 00 path on the development machine is validated against 12.0,
      so the container matches that rather than introducing a second variable.

  - name: verilator
    arg: VERILATOR_REF
    version: "v5.036"
    source: https://github.com/verilator/verilator (archive refs/tags/v5.036.tar.gz)
    arch: "linux/amd64 verified; linux/arm64 tested by upstream CI but not verified here"
    notes: >
      Ubuntu 22.04 packages 4.038, which is too old for cocotb 2.x. This is a
      conservative pin chosen to match the base image's GCC 11 rather than the
      newest tag; revisit when the course actually commits to Verilator.

  - name: yosys
    arg: YOSYS_REF
    version: "v0.66"
    source: https://github.com/YosysHQ/yosys (release asset yosys-src.tar.gz)
    arch: "linux/amd64 verified; linux/arm64 tested by upstream CI but not verified here"
    notes: >
      NOT the newest release, and the reason matters. Yosys switched to CMake
      at v0.68, which requires CMake >= 3.28, Bison >= 3.8, Python >= 3.11 and
      a C++20 compiler; Ubuntu 22.04 provides CMake 3.22 and Python 3.10, and
      upstream's own README tells 22.04 users to install a newer CMake from
      snap. v0.66 is the last Makefile-based release and builds on this
      baseline unchanged. Since Ubuntu 22.04 is itself forced by the OpenROAD
      .deb, OpenROAD's packaging transitively caps the Yosys version this
      image can carry -- see docs/toolchain-container.md. Ubuntu 22.04
      packages Yosys 0.9, so this is still a large step forward. The release
      tarball vendors abc, so the build needs no second unpinned fetch.

  # --- runtime and analog ----------------------------------------------------

  - name: ngspice
    arg: NGSPICE_APT_VERSION
    version: "36+ds-1ubuntu0.1"
    source: ubuntu-22.04 archive
    arch: "linux/amd64, linux/arm64"
    notes: >
      Pinned to the exact archive version. If Ubuntu publishes a security
      update the build fails rather than silently changing; update this line.

  - name: graphviz
    arg: GRAPHVIZ_APT_VERSION
    version: "2.42.2-6ubuntu0.1"
    source: ubuntu-22.04 archive
    arch: "linux/amd64, linux/arm64"

  - name: gtkwave
    arg: GTKWAVE_APT_VERSION
    version: "3.3.104-2build1"
    source: ubuntu-22.04 archive
    arch: "linux/amd64, linux/arm64"

  # Informational entries carry no `arg` and inject nothing; they record what
  # the environment resolves to, so the manifest stays a complete description.

  - name: python
    version: "3.10.12 (ubuntu-22.04 archive)"
    source: ubuntu-22.04 archive
    arch: "linux/amd64, linux/arm64"
    notes: >
      TECHNICAL DEBT. The interpreter and the other generic base packages
      (bash, coreutils, make, git, curl, jq) are taken from the live Ubuntu
      archive and are therefore not byte-reproducible over time: a security
      update changes them without changing this file. The build records the
      full dpkg manifest at /opt/toolchain/report/apt-packages.txt inside the
      image so any given image can still be described exactly. The real fix is
      to pin the apt sources to a snapshot.ubuntu.com timestamp; that was left
      out of this spike deliberately to keep one variable at a time. The
      course-relevant EDA packages above ARE pinned exactly.

  - name: python-packages
    version: "see toolchain/requirements.txt"
    source: PyPI
    arch: "pure Python; no architecture restriction"
    notes: >
      cocotb 2.0.1 and pytest 8.4.2 are the direct pins in requirements.in;
      requirements.txt is the generated full lock and is what the image
      installs, so the build runs no dependency resolver and needs no index at
      run time.



  # --- HIF, built from the published v1.1.0 sources ---------------------------
  #
  # Albion's development checkouts are deliberately not used. The point of this
  # image is to prove the environment is reproducible from released sources.

  - name: hif-core
    arg: HIF_CORE_REF
    version: "776fd245e72c6b1457b28983dd10f8f23a4ae086"
    source: https://github.com/hif-project/hif-core (published tag v1.1.0)
    arch: "linux/amd64 verified; linux/arm64 unknown, upstream CI is ubuntu-latest only"
    notes: >
      Needs Poco (Foundation, Util, XML). Its CMakeLists hard-codes
      set(CMAKE_INSTALL_PREFIX /usr/local) unconditionally, which overrides
      -DCMAKE_INSTALL_PREFIX; `cmake --install --prefix` overrides it back at
      install time, so no upstream patching is needed.

  - name: hif-core-archive
    arg: HIF_CORE_SHA256
    version: "e897f5af06f51f29552839a2606850e8f4b627ae30655138a341419a9033beb9"
    source: SHA-256 of the hif-core source archive
    archive_url: https://github.com/hif-project/hif-core/archive/776fd245e72c6b1457b28983dd10f8f23a4ae086.tar.gz
    archive_file: hif-core.tar.gz

  - name: hif-frontend
    arg: HIF_FRONTEND_REF
    version: "6b23a13e730aee9cde33613c3fa0e392ae3d4b2c"
    source: https://github.com/hif-project/hif-frontend (published tag v1.1.0)
    arch: "linux/amd64 verified; linux/arm64 unknown"
    notes: >
      Provides verilog2hif and vhdl2hif. Needs Flex and Bison.

  - name: hif-frontend-archive
    arg: HIF_FRONTEND_SHA256
    version: "c09cf87bfffcbd3075dd2ed86f5fb64ec62d86d53da757daa62b05698328efe9"
    source: SHA-256 of the hif-frontend source archive
    archive_url: https://github.com/hif-project/hif-frontend/archive/6b23a13e730aee9cde33613c3fa0e392ae3d4b2c.tar.gz
    archive_file: hif-frontend.tar.gz

  - name: hif-backend
    arg: HIF_BACKEND_REF
    version: "944720fd04d3e3f7fdf04e734bfdaf1a871dd825"
    source: https://github.com/hif-project/hif-backend (published tag v1.1.0)
    arch: "linux/amd64 verified; linux/arm64 unknown"
    notes: >
      TECHNICAL DEBT -- the tag is ambiguous. The v1.1.0 tag published on
      GitHub peels to this commit ("Merge branch develop into main for v1.1.0
      release"), but the development checkout on Albion has a v1.1.0 tag
      peeling to ef84e391 ("Merge branch main into develop after v1.1.0
      release"). The tag was moved after release. This image pins the
      published commit, so anyone comparing against a local checkout will see
      a different SHA. Upstream should reconcile the two.

  - name: hif-backend-archive
    arg: HIF_BACKEND_SHA256
    version: "78c35988e9b9ac9aafa5538fa997532690ab626c4f2c42aed7554e75633549a1"
    source: SHA-256 of the hif-backend source archive
    archive_url: https://github.com/hif-project/hif-backend/archive/944720fd04d3e3f7fdf04e734bfdaf1a871dd825.tar.gz
    archive_file: hif-backend.tar.gz

  - name: hif-muffin
    arg: HIF_MUFFIN_REF
    version: "bcd387f7768082cb820ea1eab1560e3276936021"
    source: https://github.com/hif-project/hif-muffin (published tag v1.1.0)
    arch: "linux/amd64 verified; linux/arm64 unknown"
    notes: >
      Provides muffin. See hif-muffin-json below for its one unpinned
      dependency.

  - name: hif-muffin-archive
    arg: HIF_MUFFIN_SHA256
    version: "316b02dd53c635daeda873be1accab453b88c16ddeb8193b9506879e8eae4912"
    source: SHA-256 of the hif-muffin source archive
    archive_url: https://github.com/hif-project/hif-muffin/archive/bcd387f7768082cb820ea1eab1560e3276936021.tar.gz
    archive_file: hif-muffin.tar.gz

  - name: hif-muffin-json
    arg: HIF_JSON_REF
    version: "930f32d755b167b0f11a1fd9c284c75fb2724485"
    source: https://github.com/Galfurian/json
    arch: "header-only C++; not architecture specific"
    notes: >
      TECHNICAL DEBT. hif-muffin v1.1.0 declares this FetchContent dependency
      with GIT_TAG main, i.e. unpinned: two builds of the same muffin tag can
      pull different code. This image pins the commit main pointed at on
      2026-08-16 and injects it through FETCHCONTENT_SOURCE_DIR_JSON, so
      upstream is not patched. Upstream should pin the tag.

  - name: hif-muffin-json-archive
    arg: HIF_JSON_SHA256
    version: "3fee96271346d0a2d5acd24e33d81b0a24811d04bfd2dc88ba4f5eabbcd21d07"
    source: SHA-256 of the Galfurian/json source archive
    archive_url: https://github.com/Galfurian/json/archive/930f32d755b167b0f11a1fd9c284c75fb2724485.tar.gz
    archive_file: hif-json.tar.gz

  - name: hif-reported-version
    version: "1.0.0 (as reported by the binaries at tag v1.1.0)"
    source: observed
    notes: >
      Informational, and a real caveat. verilog2hif, hif2verilog and muffin
      built from the v1.1.0 sources all report "version 1.0.0", and generated
      files carry the header "Generate with HIF version 1.0.0". The internal
      version string was not bumped for the 1.1.0 release, so --version cannot
      be used to tell which HIF release an installation is. The commit pins
      above are the only reliable identity; the image also records them at
      /opt/hif/BUILD_PINS.txt.


  # --- ATPG / DFT candidates --------------------------------------------------
  #
  # These are carried by the kitchen-sink image so the spike can find out
  # whether they package cleanly. The course does not depend on any of them,
  # and the toolchain doctor reports them as candidates rather than failing.

  - name: rust
    arg: RUST_VERSION
    version: "1.90.0"
    source: https://sh.rustup.rs (static.rust-lang.org)
    arch: "build-time only; toolchains published for both amd64 and arm64"
    notes: >
      Build-time only, needed to compile Quaigh. It does not reach the runtime
      image.

  - name: quaigh
    arg: QUAIGH_VERSION
    version: "0.0.6"
    source: crates.io (upstream https://github.com/Coloquinte/quaigh)
    arch: "linux/amd64 verified; linux/arm64 likely, no x86-only intrinsics found in its C deps"
    notes: >
      ATPG and logic-optimisation candidate. Installed with --locked so the
      crate's own Cargo.lock decides the dependency graph rather than a fresh
      resolution.

  - name: openroad
    arg: OPENROAD_DEB_RELEASE
    version: "2024-12-14"
    source: https://github.com/Precision-Innovations/OpenROAD/releases
    arch: "linux/amd64 ONLY -- no arm64 asset has ever been published"
    notes: >
      The newest release carrying binary assets; the later 26Q1 tag publishes
      none. This .deb is why the base image is Ubuntu 22.04: it requires
      libpython3.10 and the pre-t64 libqt5* names, so it cannot be installed on
      24.04. That choice in turn caps Yosys at 0.66. Verified to install on
      jammy with no unmet dependencies and no missing shared libraries.

  - name: openroad-deb
    arg: OPENROAD_DEB_SHA256
    version: "40ed178396b0276a5d5dfbbe695c9de9aac9088157a6655be02b39a0cef07207"
    source: SHA-256 of openroad_2.0-17598-ga008522d8_amd64-ubuntu-22.04.deb
    archive_url: https://github.com/Precision-Innovations/OpenROAD/releases/download/2024-12-14/openroad_2.0-17598-ga008522d8_amd64-ubuntu-22.04.deb
    archive_file: openroad.deb
    arch: "linux/amd64 only"

  # --- source archive integrity pins ---------------------------------------

  - name: icarus-verilog-archive
    arg: IVERILOG_SHA256
    version: "a68cb1ef7c017ef090ebedb2bc3e39ef90ecc70a3400afb4aa94303bc3beaa7d"
    source: SHA-256 of the icarus-verilog source archive
    arch: "not architecture specific: source"
    archive_url: https://github.com/steveicarus/iverilog/archive/refs/tags/v12_0.tar.gz
    archive_file: iverilog.tar.gz
    notes: >
      Integrity pin for the iverilog-12_0 source archive. Archives are pinned by digest rather than
      by tag alone because a tag can be moved and a digest cannot; the build
      fails loudly if upstream regenerates the archive.

  - name: verilator-archive
    arg: VERILATOR_SHA256
    version: "4199964882d56cf6a19ce80c6a297ebe3b0c35ea81106cd4f722342594337c47"
    source: SHA-256 of the verilator source archive
    arch: "not architecture specific: source"
    archive_url: https://github.com/verilator/verilator/archive/refs/tags/v5.036.tar.gz
    archive_file: verilator.tar.gz
    notes: >
      Integrity pin for the verilator-5.036 source archive. Archives are pinned by digest rather than
      by tag alone because a tag can be moved and a digest cannot; the build
      fails loudly if upstream regenerates the archive.

  - name: yosys-archive
    arg: YOSYS_SHA256
    version: "ba567ea7fbb1287e996aef8f20fe902f6fd408593aa50cfaea8ae0c9015ab872"
    source: SHA-256 of the yosys source archive
    arch: "not architecture specific: source"
    archive_url: https://github.com/YosysHQ/yosys/releases/download/v0.66/yosys-src.tar.gz
    archive_file: yosys.tar.gz
    notes: >
      Integrity pin for the yosys v0.66 release asset yosys-src.tar.gz (a FLAT archive: do not strip components). Archives are pinned by digest rather than
      by tag alone because a tag can be moved and a digest cannot; the build
      fails loudly if upstream regenerates the archive.
