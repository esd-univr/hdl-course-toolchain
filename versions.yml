  - name: yosys
    arg: YOSYS_REF
    version: "v0.69"
    source: https://github.com/YosysHQ/yosys
    upstream: github-release:YosysHQ/yosys
    arch: "linux/amd64 verified at v0.66; linux/arm64 supported upstream but not yet qualified here"
    notes: >
      v0.69 uses the CMake build introduced after v0.66 and requires a modern
      compiler. The builder uses a dedicated Clang/Python/CMake toolchain while
      the runtime remains on the Ubuntu 22.04 baseline for OpenROAD compatibility.

  - name: yosys-archive
    arg: YOSYS_SHA256
    version: "6dad6412cae417f5a53e2c943c2aee160162cfc1bdd31669230da1b7e3522571"
