# Version manifest for the HDL course toolchain.
#
# This is the single source of truth for build-time pins. No version string may
# be hard-coded in the Containerfile or build scripts: each ARG declared by the
# Containerfile must have exactly one entry here, and scripts/versions.py checks
# that the two stay aligned.
#
# Grammar: top-level scalars followed by one `tools:` list of flat mappings.
# Values are scalars or folded (`>`) blocks so the manifest can be read using
# only the Python standard library.
#
# Fields:
#   name          human-readable tool name
#   arg           Containerfile ARG receiving this pin
#   version       tag, commit, package version, or archive SHA-256
#   source        upstream source or package channel
#   upstream      where scripts/configure.py looks for newer versions:
#                   github-release:owner/repo        latest published release
#                   github-tag:owner/repo            latest tag
#                   github-commit:owner/repo@branch  distance from a branch head
#                   crates:name                      newest crates.io version
#                   ubuntu:suite/source-package      newest Ubuntu archive version
#                   manual                           no machine-readable source
#   arch          known architecture support / qualification state
#   archive_url   downloadable source or binary artifact
#   archive_file  local filename used by scripts/fetch-sources.sh
#   notes         reproducibility caveats and rationale

manifest_version: 1
recorded: 2026-09-10

tools:
  # --- base environment -------------------------------------------------------

  - name: base-image
    arg: BASE_IMAGE
    version: "ubuntu:22.04@sha256:3b06811b2afd352be909dd088a004166d665dc76d38b13eada33522a9d915c6f"
    source: docker.io/library/ubuntu
    upstream: manual
    arch: "multi-arch index: linux/amd64 and linux/arm64 manifests both present"
    notes: >
      Ubuntu 22.04 is retained because the available OpenROAD binary package
      depends on Python 3.10 and the pre-t64 Qt5 package names used by jammy.

  - name: build-cmake
    arg: BUILD_CMAKE_VERSION
    version: "3.31.1"
    source: https://cmake.org
    upstream: github-release:Kitware/CMake
    arch: "build-time only; shared by the Yosys and HARM builders"
    notes: >
      Yosys 0.69 requires CMake 3.28 or newer and HARM v3 requires CMake 3.30
      or newer. Ubuntu 22.04 ships an older CMake, so one pinned source build is
      shared by both stages and does not reach the runtime image.

  - name: build-cmake-archive
    arg: BUILD_CMAKE_SHA256
    version: "c4fc2a9bd0cd5f899ccb2fb81ec422e175090bc0de5d90e906dd453b53065719"
    source: SHA-256 published for CMake 3.31.1
    archive_url: https://cmake.org/files/v3.31/cmake-3.31.1.tar.gz
    archive_file: build-cmake.tar.gz

  # --- simulation and synthesis ---------------------------------------------

