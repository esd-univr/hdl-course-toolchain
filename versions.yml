  - name: verilator
    arg: VERILATOR_REF
    version: "v5.052"
    source: https://github.com/verilator/verilator
    upstream: github-tag:verilator/verilator
    arch: "linux/amd64 verified at v5.050; linux/arm64 supported upstream but not yet qualified here"
    notes: >
      Built from source because Ubuntu 22.04 packages Verilator 4.038, which is
      too old for the pinned cocotb 2.x environment. v5.052 is pending local
      qualification by the course doctor and teaching tests.

