  - name: vcdtui
    arg: VCDTUI_REF
    version: "v0.5.0"
    source: https://github.com/Galfurian/vcdtui
    upstream: github-release:Galfurian/vcdtui
    arch: "pure Python; architecture independent"
    notes: >
      Primary waveform viewer for the HDL course toolchain. Requires only
      Python 3.10+ standard library modules and provides both an interactive
      terminal UI and deterministic non-interactive dumps. v0.2.0 was the
      first release able to open a trace written by the pinned Icarus
      Verilog; v0.1.0 rejected every one of them with "unsupported
      value-change directive $comment" and so failed the doctor smoke test.
      v0.3.0 adds --scope, which course material depends on: a testbench that
      instantiates one DUT at two parameterisations repeats its port names at
      three hierarchy paths, and without a scope those names either
      over-select or have to be spelled out in full. Default --dump output is
      unchanged from v0.2.0, so the doctor smoke test needs no edit.

  - name: vcdtui-archive
    arg: VCDTUI_SHA256
    version: "c86671f9d59159629f11fa3f759ba661700523d25a08313a4140a42f633e851d"
    source: SHA-256 of the vcdtui v0.5.0 release source archive
    archive_url: https://github.com/Galfurian/vcdtui/archive/refs/tags/v0.5.0.tar.gz
    archive_file: vcdtui.tar.gz
    arch: "source; architecture independent"

  - name: python
    version: "3.10.12 (ubuntu-22.04 archive)"
    source: ubuntu-22.04 archive
    upstream: manual
    arch: "linux/amd64, linux/arm64"
    notes: >
      Generic base packages are taken from the live Ubuntu archive and are not
      byte-reproducible over time. Each built image records the resolved dpkg
      manifest at /opt/toolchain/report/apt-packages.txt. Pinning apt to a
      snapshot remains technical debt.

  - name: python-packages
    version: "see requirements.txt"
    source: PyPI
    upstream: manual
    arch: "pure Python; no architecture restriction"
    notes: >
      requirements.txt is the fully resolved lock installed by the image;
      requirements.in records the direct dependencies.

