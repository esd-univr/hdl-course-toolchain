name: release

# Cut a release by pushing an annotated tag vX.Y.Z (scripts/release.sh does
# this). One coherent publication comes out of this workflow:
#
#   * ghcr.io/esd-univr/hdl-course-toolchain:vX.Y.Z   built from the tagged
#     source, health-checked with toolchain-doctor, and never overwritten
#   * ghcr.io/esd-univr/hdl-course-toolchain:latest    moved to the same image
#   * a GitHub Release vX.Y.Z with install.sh, hdl-toolchain and SHA256SUMS
#
# The image build compiles Verilator, Yosys, OpenROAD, HARM and HIF from
# source; it is slow. If it outgrows the hosted-runner limit, point the
# `image` job at a self-hosted runner (see docs/releasing.md).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/esd-univr/hdl-course-toolchain

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Resolve and cross-check the version
        id: v
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          bare="${tag#v}"
          echo "version=${tag}" >> "$GITHUB_OUTPUT"

          file_ver="$(cat VERSION)"
          [ "v${file_ver}" = "${tag}" ] \
            || { echo "::error::VERSION file is ${file_ver}, tag is ${tag}"; exit 1; }

          grep -q "^VERSION=\"${tag}\"\$" install.sh \
            || { echo "::error::install.sh does not pin ${tag}"; exit 1; }
          grep -q "^VERSION=\"${tag}\"\$" uninstall.sh \
            || { echo "::error::uninstall.sh does not pin ${tag}"; exit 1; }
          grep -q "^LAUNCHER_VERSION=\"${bare}\"\$" bin/hdl-toolchain \
            || { echo "::error::bin/hdl-toolchain does not pin ${bare}"; exit 1; }

      - name: The versioned image tag must not already exist
        run: |
          if docker manifest inspect "${IMAGE}:${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${GITHUB_REF_NAME} is already published — releases are immutable"
            exit 1
          fi

      - name: The GitHub release must not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::release ${GITHUB_REF_NAME} already exists"
            exit 1
          fi

      - name: Repository checks, shellcheck, launcher/installer/uninstaller tests
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          make check
          shellcheck -S warning bin/hdl-toolchain install.sh uninstall.sh scripts/*.sh
          make test

  image:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: docker/setup-buildx-action@v3

      - name: Fetch and verify pinned sources
        run: make fetch

      - name: Build the image from the tagged source
        env:
          HDL_TOOLCHAIN_IMAGE: ${{ env.IMAGE }}
          HDL_TOOLCHAIN_TAG: ${{ needs.guard.outputs.version }}
          HDL_TOOLCHAIN_IMAGE_VERSION: ${{ needs.guard.outputs.version }}
        run: make build

      - name: Health-check the built image (toolchain-doctor)
        env:
          HDL_TOOLCHAIN_IMAGE: ${{ env.IMAGE }}
          HDL_TOOLCHAIN_TAG: ${{ needs.guard.outputs.version }}
        run: |
          ./bin/hdl-toolchain --pull never --workspace . -- toolchain-doctor

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the versioned image, then move latest
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${VERSION}"
          docker tag  "${IMAGE}:${VERSION}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"
          digest="$(docker image inspect "${IMAGE}:${VERSION}" --format '{{index .RepoDigests 0}}')"
          echo "published: ${digest}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "IMAGE_DIGEST=${digest}" >> "$GITHUB_ENV"

      - name: Record the digest for the release job
        run: echo "${IMAGE_DIGEST}" > image-digest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt

  release:
    needs: [guard, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image-digest

      - name: Assemble release assets
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp install.sh dist/install.sh
          cp uninstall.sh dist/uninstall.sh
          cp bin/hdl-toolchain dist/hdl-toolchain
          ( cd dist && sha256sum hdl-toolchain install.sh uninstall.sh > SHA256SUMS )
          cat dist/SHA256SUMS

          digest="$(cat image-digest.txt)"
          cat > dist/NOTES.md <<EOF
          ## hdl-course-toolchain ${VERSION}

          ### Official image
          \`\`\`
          docker pull ${IMAGE}:${VERSION}
          ${digest}
          \`\`\`
          \`${IMAGE}:latest\` now points at this image.

          ### Student install (one time)
          \`\`\`
          curl -fsSL https://github.com/esd-univr/hdl-course-toolchain/releases/latest/download/install.sh | bash
          \`\`\`
          Then, from any lesson directory:
          \`\`\`
          hdl-toolchain --workspace . -- zsh -l
          \`\`\`
          To remove it later: \`curl -fsSL .../releases/latest/download/uninstall.sh | sh\`.

          ### Qualification
          Toolchain-release qualification evidence is in the maintainer's
          \`make qualify\` record for the tagged commit. Course/lesson
          qualification is tracked separately in each course repository.
          EOF

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            dist/hdl-toolchain dist/install.sh dist/uninstall.sh dist/SHA256SUMS \
            --title "hdl-course-toolchain ${VERSION}" \
            --notes-file dist/NOTES.md \
            --verify-tag
