name: Check

on:
  push:
    branches: ['**']   # branch pushes only — a release tag push triggers no CI
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run fast checks
        run: make check

      - name: Shellcheck launcher, installer, uninstaller and scripts
        run: shellcheck -S warning bin/hdl-toolchain install.sh uninstall.sh scripts/*.sh

      - name: Configure Git identity for integration-test fixtures
        run: |
          git config --global user.email "ci@localhost"
          git config --global user.name "CI"

      - name: Launcher and installer tests
        run: make test
